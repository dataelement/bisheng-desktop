name: Build BiSheng Web Runtime (Portable)

on:
  push:
    tags:
      - 'v*'
    branches:
      - codex/web-minimal
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Target Platform to build'
        required: true
        default: 'windows-x64'
        type: choice
        options:
          - 'windows-x64'
          - 'all'

jobs:
  build-windows:
    name: Build Windows x64 Portable Runtime
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Host)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python (Host)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pnpm & Tools
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Download Bundled Windows Node.js Runtime (v22 / v24)
        shell: bash
        run: |
          mkdir -p dist/bisheng-web-runtime-test/node
          curl -sL https://nodejs.org/dist/v22.14.0/node-v22.14.0-win-x64.zip -o node-win.zip
          unzip -q node-win.zip
          mv node-v22.14.0-win-x64/* dist/bisheng-web-runtime-test/node/
          rm -rf node-win.zip node-v22.14.0-win-x64

      - name: Run Runtime Staging Assembly & Pre-flight Validation
        shell: bash
        run: |
          # 1. 组装与打补丁 (自动执行 Plugin Manager verifiedInstallContract 与 Sidebar quickSwitcher slot)
          node scripts/build-web-runtime.mjs

          # 2. 校验关键契约是否已注入，避免打包后回归
          node -e '
          const fs = require("fs");
          const target = "dist/bisheng-web-runtime/dsh/node_modules";

          // 校验 1: Sidebar quickSwitcher 插槽
          const sbFile = target + "/@deepseek-ai/dsh-client-ui-sidebar/lib/client.js";
          if (fs.existsSync(sbFile)) {
            const content = fs.readFileSync(sbFile, "utf8");
            if (!content.includes("sidebar.quickSwitcher")) {
              throw new Error("Validation Failed: sidebar.quickSwitcher slot missing in client.js!");
            }
            console.log("✅ Verified: sidebar.quickSwitcher slot present");
          }

          // 校验 2: Plugin Manager verifiedInstallContract 与 managedBundleSourceContract
          const pmFile = target + "/@deepseek-ai/dsh-plugin-manager/lib/index.js";
          if (fs.existsSync(pmFile)) {
            const content = fs.readFileSync(pmFile, "utf8");
            if (!content.includes("verifiedInstallContract = 1;")) {
              throw new Error("Validation Failed: verifiedInstallContract missing in dsh-plugin-manager!");
            }
            if (!content.includes("managedBundleSourceContract = 1;")) {
              throw new Error("Validation Failed: managedBundleSourceContract missing in dsh-plugin-manager!");
            }
            console.log("✅ Verified: verifiedInstallContract & managedBundleSourceContract present");
          }
          '

      - name: Create 7z & Zip Archives
        shell: bash
        run: |
          cd dist
          7z a -t7z -mx=7 -ms=on bisheng-web-runtime-windows-x64.7z bisheng-web-runtime
          python -c "
          import os, zipfile
          with zipfile.ZipFile('bisheng-web-runtime-windows-x64.zip', 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for root, _, files in os.walk('bisheng-web-runtime'):
                  for f in files:
                      fp = os.path.join(root, f)
                      info = zipfile.ZipInfo.from_file(fp, os.path.relpath(fp, '.'))
                      info.flag_bits |= 0x800
                      zf.writestr(info, open(fp, 'rb').read())
          "
          shasum -a 256 bisheng-web-runtime-windows-x64.7z > bisheng-web-runtime-windows-x64.7z.sha256
          shasum -a 256 bisheng-web-runtime-windows-x64.zip > bisheng-web-runtime-windows-x64.zip.sha256
          ls -lh bisheng-web-runtime-windows-x64.*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bisheng-web-runtime-windows-x64
          path: |
            dist/bisheng-web-runtime-windows-x64.7z
            dist/bisheng-web-runtime-windows-x64.zip
            dist/bisheng-web-runtime-windows-x64.7z.sha256
            dist/bisheng-web-runtime-windows-x64.zip.sha256

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bisheng-web-runtime-windows-x64.7z
            dist/bisheng-web-runtime-windows-x64.zip
            dist/bisheng-web-windows-x64.7z.sha256
            dist/bisheng-web-windows-x64.zip.sha256
          draft: false
          prerelease: false
