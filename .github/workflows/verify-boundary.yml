name: Downstream Boundary Gatekeeper

on:
  pull_request:
    branches: [main, codex/bisheng-unified]
  push:
    branches: [main, codex/bisheng-unified]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Fetch the reviewed upstream baseline
        run: |
          git remote add upstream https://github.com/dataelement/dsh-desktop.git
          git fetch --no-tags upstream bisheng-adaptor:refs/remotes/upstream/bisheng-adaptor
          git rev-parse --verify upstream/bisheng-adaptor
      - name: Verify downstream changes
        run: npm run verify:boundary
        env:
          UPSTREAM_BASE: upstream/bisheng-adaptor
