name: BiSheng candidate checks

on:
  pull_request:
    branches: [main, V1.3.1, codex/bisheng-unified]
  push:
    branches: [main, V1.3.1, codex/bisheng-unified]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bisheng-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-checks:
    name: Native checks (${{ matrix.platform }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            desktop: false
          - runner: windows-2022
            platform: win32
            arch: x64
            desktop: true
            package-script: package:dev:win
            artifact-platform: win
          - runner: macos-15
            platform: darwin
            arch: arm64
            desktop: true
            package-script: package:dev:mac:arm64
            artifact-platform: mac
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            desktop: true
            package-script: package:dev:mac:x64
            artifact-platform: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DSH_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        shell: ${{ matrix.platform == 'win32' && 'pwsh' || 'bash' }}
    steps:
      # The boundary gate compares raw bytes against reviewed Git objects.
      - name: Preserve repository bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Verify native ordinary Node target
        run: node -e "if(process.platform !== '${{ matrix.platform }}' || process.arch !== '${{ matrix.arch }}' || process.version !== 'v24.15.0') process.exit(1)"
      - name: Fetch reviewed upstream baseline
        shell: bash
        run: |
          git remote add upstream https://github.com/dataelement/dsh-desktop.git
          baseline_commit=$(node -e "const b=require('./ops/ci/upstream-baseline.json');if(!/^[a-f0-9]{40}$/.test(b.commit))process.exit(1);process.stdout.write(b.commit)")
          git fetch --no-tags upstream "$baseline_commit"
          git update-ref refs/remotes/upstream/V0.14.1 "$baseline_commit"
          git rev-parse --verify upstream/V0.14.1
      - run: npm run verify:boundary
        env:
          UPSTREAM_BASE: upstream/V0.14.1
      - name: Install locked dependencies with postinstall
        run: node ops/ci/npm-ci.mjs --prefer-offline --no-audit --no-fund
      - name: Verify pinned pnpm
        run: node node_modules/pnpm/bin/pnpm.cjs --version | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{if(s.trim()!=='10.34.5')process.exit(1)})"
      - name: Verify native Windows tar
        if: matrix.platform == 'win32'
        run: |
          $expectedTar = Join-Path $env:SystemRoot 'System32/tar.exe'
          if ((Get-Command tar.exe).Source -ne $expectedTar) { throw 'Expected Windows native tar, not Git Bash tar' }
          tar.exe --version
      - name: Verify Windows enterprise installation and path regressions
        if: matrix.platform == 'win32'
        run: node node_modules/vitest/vitest.mjs run test/enterprise-community-package.test.ts test/enterprise-market.test.ts test/enterprise-boundary-gate.test.mjs test/generation-build-approval.integration.test.js test/packaged-layout.test.mjs --maxWorkers=2
      - run: npm run typecheck
      - name: Build on supported native Office targets
        if: matrix.desktop
        run: npm run build
      - name: Run complete regressions under ordinary Node on supported native targets
        if: matrix.desktop
        run: npm test -- --maxWorkers=2
      - name: Run Linux pure Web regressions without native Office preparation
        if: ${{ !matrix.desktop }}
        run: node node_modules/vitest/vitest.mjs run test/web-runtime-ci.test.mjs test/web-runtime-ci-workflows.test.mjs test/web-runtime-offline-launcher.test.mjs test/web-runtime-system-proxy.test.mjs test/enterprise-linux-installer.test.mjs --maxWorkers=2
      - name: Verify native Desktop loader
        if: matrix.desktop
        run: node scripts/verify/verify-target.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Build unsigned Desktop packages with mandatory afterPack gates
        if: matrix.desktop
        run: npm run ${{ matrix.package-script }}
      - name: Verify Desktop package files
        if: matrix.desktop
        run: node ops/ci/desktop-artifacts.mjs development ${{ matrix.artifact-platform }} ${{ matrix.arch }}
      - name: Verify tracked sources remain clean
        run: git diff --exit-code
